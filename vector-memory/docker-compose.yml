version: "3.9"

services:
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/data  # ChromaDB의 기본 저장 경로

  embedder:
    build:
      context: ./embedder
      dockerfile: Dockerfile
    container_name: embedder
    ports:
      - "8001:8001"
    restart: always