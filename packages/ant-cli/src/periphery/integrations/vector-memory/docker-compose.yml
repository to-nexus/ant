# Vector Memory Infrastructure
# Usage: docker compose up -d

services:
  chroma:
    image: chromadb/chroma:latest
    container_name: ant-chroma
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/data

  embedder:
    build:
      context: ./embedder
      dockerfile: Dockerfile
    container_name: ant-embedder
    ports:
      - "8001:8001"
    restart: always