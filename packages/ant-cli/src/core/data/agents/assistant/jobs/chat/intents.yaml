# Job intent catalog — intents are job-only (this file lives next to job.yaml).
#
# Intents are selected explicitly, never auto-classified: a turn carries the
# `@intent:` mentions from the composer (or the execute body's `intents`), and
# those intents' `injections` files (this job's injections/*.md) are inlined in
# full. Everything else stays in an on-demand table of contents, where each
# `description` below is the row the model reads to decide what to pull in with
# read_file — so write it for that judgment. `general` is reserved for a turn
# with no mention and cannot be declared here.
version: 1
intents:
  - id: research
    description: 'Questions needing current or external information from the web — news, prices, releases, product comparisons, fact-checking a claim'
    injections: [web-research.md]
  - id: writing
    description: 'Drafting, revising, or maintaining a document, report, plan, or other written deliverable kept as a file'
    injections: [document-workflow.md]
  - id: coding
    description: 'Writing, fixing, explaining, or running code, scripts, or shell commands'
    injections: [coding-practices.md]
  - id: analysis
    description: 'Summarizing, extracting from, transforming, or computing over files or data already in the artifact tree'
    injections: [data-analysis.md]
