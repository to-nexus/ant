# Job intent catalog — intents are job-only (this file lives next to job.yaml).
#
# Intents are selected explicitly or by the catalog's `default` — never by a
# runtime classifier. A turn carries the `@intent:` mentions from the composer
# (or the execute body's `intents`); a turn that pins nothing runs as the one
# intent marked `default: true`, or as the reserved `general` when no default
# is declared. Active intents' `injections` files (this job's injections/*.md)
# are inlined in full; everything else stays on demand.
#
# Every `description` below is rendered verbatim into the agent's Intent
# Catalog as that situation's criterion — it is what the model reads to decide
# which files to pull in with read_file, and what an @intent: mention selects.
# Write it as a trigger condition ("when does this apply"), not a summary.
# `general` cannot be declared here.
version: 1
intents:
  - id: research
    description: 'Questions needing current or external information from the web — news, prices, releases, product comparisons, fact-checking a claim'
    injections: [web-research.md]
  - id: writing
    description: 'Drafting, revising, or maintaining a document, report, plan, or other written deliverable kept as a file'
    injections: [document-workflow.md]
  - id: coding
    description: 'Writing, fixing, explaining, or running code, scripts, or shell commands'
    injections: [coding-practices.md]
  - id: analysis
    description: 'Summarizing, extracting from, transforming, or computing over files or data already in the artifact tree'
    injections: [data-analysis.md]
