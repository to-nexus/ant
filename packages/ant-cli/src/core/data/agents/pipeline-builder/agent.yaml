# Built-in pipeline-authoring agent, shipped read-only with Ant (`builtin`
# scope). It is the other half of one boundary the agent builder draws: the
# agent builder authors what an agent DOES and filters out when it runs; this
# agent owns exactly that filtered half — the schedule, and the run order
# between a finished agent's intents.
# It is not editable or forkable from the UI — create your own agent (under a
# different id; same-id creation is refused with 409) to customize behavior.
# Authoring guide: docs/guides/custom-agent-authoring.md
#
# The agent contributes identity (name) and the always-on base/*.md prose.
# Tools, intents, and the API connection are job-owned — see jobs/author/.
id: pipeline-builder # must equal the directory name, [a-z0-9][a-z0-9-]*
name: 'Pipeline Builder'
version: 1
# No mcp: block on purpose. An MCP server runs arbitrary code and depends on
# registered credentials a shipped agent cannot assume. The one connection this
# agent needs — this Ant server's own API — is declared as an `apis` self entry
# in the job, which resolves from the runtime and needs no registration.
