# Sample job: chat-only Q&A — no files are produced.
# Demonstrates tool narrowing: `tools.builtin` here is a strict subset of the
# agent's bound (read-only tools only, no write tools), and `outputs.mode:
# none` matches — a 'contract' job without a write tool would fail validation.
id: quick-answer
name: 'Quick Answer'
description: 'Chat-only Q&A over the web and existing artifacts — writes no files'
version: 1
plan: 'off' # quoted on purpose: bare `off` is a boolean in YAML 1.1 tooling
outputs:
  mode: none
tools:
  builtin:
    - read_file
    - list_files
    - search_files
    - fetch_url
    - search_web
