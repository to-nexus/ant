# Built-in sample agent, shipped read-only with Ant (`builtin` scope).
# To customize it, create an agent with the same id in project or user scope
# (.ant/agents/sample-researcher/) — a closer scope replaces this entire
# directory, jobs included. Authoring guide: docs/guides/custom-agent-authoring.md
id: sample-researcher # must equal the directory name, [a-z0-9][a-z0-9-]*
name: 'Sample Researcher'
description: 'Built-in sample: web research with sourced briefs. Study or shadow it to build your own agent.'
version: 1
# No mcp: block on purpose. An MCP server runs arbitrary code and depends on
# host env vars a shipped sample cannot assume. See the authoring guide for a
# full mcp.servers example.
tools:
  # Upper bound for member jobs — jobs may only narrow this list, never widen it.
  # Omitting `builtin` entirely would grant the full universal tool set.
  builtin:
    - read_file
    - list_files
    - search_files
    - create_file
    - edit_file
    - fetch_url
    - search_web
  # Per-tool approval override: 'always' | 'never'. Mutating tools
  # (http_request, run_command) default to 'always'; everything else to 'never'.
  approval:
    fetch_url: never
# 'none' (default) = no access to the canonical workspace plane;
# 'read' = read-only opt-in.
workspace: none
