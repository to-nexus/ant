# Plan Job Definition
id: plan
agent: planner
description: |
  Creates and refines PRD (Product Requirements Document).
  Works with non-developers (PMs, business teams) to produce PRD artifacts.
  Uses PRD-as-State pattern: the PRD file is the persistent state across jobs.

modes:
  - id: generate
    description: |
      Creates new PRD from user directive.
      Generates comprehensive product requirements document from scratch.
    detection:
      none_of:
        - path: inputs/sources/prd.md
          type: file_exists
    prerequisites:
      required:
        - id: directive
          type: has_directive
          description: Product description or requirements entered via chat
      recommended: []
    scope:
      - PRD creation from product description
      - PRD requirement structuring and scoping
      - PRD feature specification
    outputs:
      - name: prd.md
        description: Product Requirements Document (goals, user stories, features, scope, constraints)

  - id: refine
    description: |
      Refines existing PRD based on user feedback or evaluation results.
      Improves quality, adds missing sections, clarifies requirements.
    detection:
      any_of:
        - path: inputs/sources/prd.md
          type: file_exists
    prerequisites:
      required:
        - id: existing_prd
          type: file_exists
          path: inputs/sources/prd.md
          description: Existing PRD document
        - id: directive
          type: has_directive
          description: Refinement instructions entered via chat
      recommended: []
    scope:
      - PRD improvement and refinement
      - Requirement clarification
      - Section expansion and detail addition
    outputs:
      - name: prd.md
        description: Updated PRD with improved quality and expanded sections

  - id: explain
    description: |
      Analyzes and explains existing PRD content without modifying it.
      Answers questions about PRD structure, requirements, and coverage.
      Read-only exploration — no file writes.
    detection:
      all_of:
        - path: inputs/sources/prd.md
          type: file_exists
        - type: has_directive
    prerequisites:
      required:
        - id: existing_prd
          type: file_exists
          path: inputs/sources/prd.md
          description: Existing PRD document to analyze
      recommended: []
    scope:
      - PRD content analysis and explanation
      - PRD structure and requirement queries
      - PRD content-based improvement suggestions (non-rubric)
    outputs: []

redirect_signals:
  to_design: >
    Request target is a design artifact — user EXPLICITLY names a design artifact
    (UI spec, system design doc) as the output to produce.
    Redirect is only valid when workspace has input materials for the target job.
  to_code: >
    Request target is source code — user EXPLICITLY requests to write, implement, or fix source code files.
    Redirect is only valid when workspace has input materials for the target job.
  to_learn: >
    Request target is codebase analysis or indexing output.
    Redirect is only valid when workspace has input materials for the target job.
