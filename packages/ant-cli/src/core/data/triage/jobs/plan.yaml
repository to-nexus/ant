# Plan Job Definition
id: plan
agent: planner
description: |
  Creates and refines PRD (Product Requirements Document).
  Works with non-developers (PMs, business teams) to produce PRD artifacts.
  Uses PRD-as-State pattern: the PRD file is the persistent state across jobs.

modes:
  - id: generate
    description: |
      Creates new PRD from user directive.
      Generates comprehensive product requirements document from scratch.
    detection:
      none_of:
        - path: inputs/sources/prd.md
          type: file_exists
    prerequisites:
      required:
        - id: directive
          type: has_directive
          description: Product description or requirements entered via chat
      recommended: []
    scope:
      - PRD creation from product description
      - PRD requirement structuring and scoping
      - PRD feature specification

  - id: refine
    description: |
      Refines existing PRD based on user feedback or evaluation results.
      Improves quality, adds missing sections, clarifies requirements.
    detection:
      any_of:
        - path: inputs/sources/prd.md
          type: file_exists
    prerequisites:
      required:
        - id: existing_prd
          type: file_exists
          path: inputs/sources/prd.md
          description: Existing PRD document
        - id: directive
          type: has_directive
          description: Refinement instructions entered via chat
      recommended: []
    scope:
      - PRD improvement and refinement
      - Requirement clarification
      - Section expansion and detail addition

redirect_signals:
  to_design: >
    User EXPLICITLY names a design artifact (UI spec, system design doc) as the artifact to create
    AND workspace has input materials for the target job.
    Observe workspace state to verify target job prerequisites exist.
    General commands or mentioning technology/architecture as part of PRD work are NOT redirect signals.
    Redirect without target job prerequisites is invalid.
  to_code: >
    User EXPLICITLY requests to write, implement, or fix source code files
    AND workspace has input materials for the target job.
    Describing implementation requirements in a PRD context is NOT a redirect signal.
    Redirect without target job prerequisites is invalid.
  to_learn: >
    User mentions codebase analysis, indexing, or understanding existing code
    AND workspace has input materials for the target job.
    Redirect without target job prerequisites is invalid.
