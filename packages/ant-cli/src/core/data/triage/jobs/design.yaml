# Design Job Definition
id: design
agent: architect
description: |
  Creates specifications and architecture documents.
  Three modes: Spec (feature-scoped multi-boundary planning), UI Design (from Figma or visual assets), System Design (from PRD or instructions).
  Spec mode analyzes existing codebase and plans multi-boundary changes before implementation.
  Output documents guide Code Job for accurate implementation.

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Mode order matters — detectMode walks modes top-down and returns the
# first match. Order from MOST SPECIFIC to LEAST SPECIFIC so that
# code-only workspaces (directive only) hit `spec` before falling
# through to system-design as a generic catch-all.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
modes:
  - id: spec
    description: |
      Creates feature-scoped specification documents for implementation planning.
      Analyzes existing codebase to understand affected boundaries and plan changes.
      Handles multi-boundary tasks: bug analysis, feature additions, complex modifications.
      Has full codebase analysis capability — equivalent to code job's analysis power.
    # Detection: directive present AND no visual/source artifacts.
    # This is the canonical "code workspace, multi-boundary work" pattern.
    detection:
      all_of:
        - type: has_directive
        - none_of:
            - path: inputs/sources
              type: directory_with_files
            - path: inputs/assets
              type: directory_with_files
            - type: figma_config
    prerequisites:
      required:
        - id: directive
          type: has_directive
          description: Task description or problem statement entered via chat
      recommended:
        - id: codebase
          type: indexed_codebase
          description: Existing codebase for analysis
    scope:
      - Feature-scoped implementation planning
      - Multi-boundary bug analysis and root cause investigation
      - Cross-module impact analysis
      - Task decomposition for complex modifications
    outputs:
      - name: spec-*.md
        description: Feature-scoped specification document (analysis, affected boundaries, implementation plan)

  - id: ui-design
    description: |
      Generates UI specification documents from a Figma design file or visual assets.
      Analyzes visual design or asset files to extract tokens, components, and layouts.
    # Detection: visual artifact present (assets directory or Figma config).
    # PRD/directive alone does NOT indicate ui-design intent — those route to
    # system-design or spec depending on workspace shape.
    detection:
      any_of:
        - path: inputs/assets
          type: directory_with_files
        - type: figma_config
    prerequisites:
      required:
        - id: source_or_figma
          type: any_of
          items:
            - type: file_with_content
              path: inputs/prd.md
              description: PRD document (inputs/sources/)
            - type: has_directive
              description: Instructions entered via chat
            - type: figma_config
              description: Figma design files configured (outputs/design/ui/figma/figma.json)
      recommended:
        - id: assets
          type: directory_with_files
          path: inputs/assets
          description: Asset files like icons and images (inputs/assets/)
    scope:
      - Design tokens (colors, typography, spacing, shadows)
      - Asset mappings and icon system
      - UI component specifications with props and variants
      - Layout structure and responsive breakpoints
    outputs:
      - name: ui-tokens.md
        description: Design system tokens (colors, typography, spacing, borders, shadows, breakpoints)
      - name: ui-assets.md
        description: Asset mappings (icons, images, logos with naming conventions)
      - name: ui-spec.md
        description: Component specifications (hierarchy, props, variants, layout, states)

  - id: system-design
    description: |
      Creates system architecture from PRD or instructions.
      Generates API specifications, data models, and technical architecture.
      Suitable for backend, fullstack, or complex system design.
    # Detection: PRD (or any text source) present, OR directive without
    # visual artifacts (matches when spec didn't fire because the
    # directive shape suggests system/architecture work — fallback path).
    detection:
      any_of:
        - path: inputs/sources
          type: directory_with_files
        - type: has_directive
    prerequisites:
      required:
        - id: prd_or_directive
          type: any_of
          items:
            - type: file_with_content
              path: inputs/prd.md
              description: PRD document (inputs/prd.md)
            - type: has_directive
              description: Instructions entered via chat
      recommended:
        - id: codebase
          type: indexed_codebase
          description: Existing codebase (recommended for refactor mode)
    scope:
      - System architecture design
      - API interface design (REST, GraphQL, etc.)
      - Data model and schema design
      - Service boundaries and interactions
    outputs:
      - name: be-system-main.md
        description: System architecture document (API specs, data models, services, error handling)

redirect_signals:
  to_code: Design documents already exist AND the directive requests implementation as the output. Design job handles explanation, analysis, and investigation directly (has code reading tools).
  to_learn: Request target is codebase analysis or indexing output
  to_plan: >
    Request target is a PRD artifact — either:
    (1) user EXPLICITLY names "PRD" as the output to produce, OR
    (2) user asks to analyze, explain, or query PRD content (explain intent targeting PRD)
