# Visual Job Definition
id: visual
agent: creator
description: |
  Generates visual assets and provides expert consultation on visual design.
  Uses AI image generation models to create project-specific assets.
  Handles questions and analysis about visual styles, assets, and creative direction.
  Conversational workflow: maintains context across multiple turns.

modes:
  - id: generate
    description: |
      Creates new visual assets from user directive.
      Supports progressive refinement: sketch exploration → selection → final render.
    detection:
      any_of:
        - type: has_directive
    prerequisites:
      required:
        - id: directive
          type: has_directive
          description: Asset description or visual requirements entered via chat
      recommended: []
    scope:
      - Image asset generation (PNG, WebP, JPEG)
      - Icon and illustration creation
      - SVG code generation for simple shapes
      - Progressive refinement with sketch exploration
      - Conversational iteration on visual output
    outputs:
      - name: Image assets
        description: Generated visual assets (PNG, WebP, JPEG) and SVG code

  - id: explain
    description: |
      Answers questions and provides expert consultation on any visual design topic.
      Covers general visual knowledge, creative direction, style guidance, technical advice,
      and analysis of existing assets when available. No image generation — text response only.
    detection:
      any_of:
        - type: has_directive
    prerequisites:
      required:
        - id: directive
          type: has_directive
          description: Question or consultation request related to visual design
      recommended: []
    scope:
      - General visual design knowledge (styles, techniques, composition principles)
      - Creative direction consultation and recommendations
      - Technical guidance on asset formats, sizes, accessibility, and constraints
      - Analysis of existing sketches or finalized outputs when available
      - Pre-generation consultation (what to consider, which approach to take)
    outputs:
      - name: Text response
        description: Expert consultation and analysis (no image generation)

redirect_signals:
  to_design: >
    Request target is a design document or UI specification, not a visual asset.
  to_code: >
    Request target is source code implementation, not a visual asset.
  to_plan: >
    Request target is a product requirements document, not a visual asset.
