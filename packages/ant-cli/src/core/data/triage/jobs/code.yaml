# Code Job Definition
id: code
agent: architect
description: |
  Generates, modifies, and explains code for any project type.
  Works with frontend, backend, fullstack, mobile, or any language/framework.
  Handles code explanation and analysis requests of any scope (single or multi-boundary).
  Adapts to your existing codebase patterns when Learn Job has been run.

modes:
  - id: new-development
    description: |
      Creates new code from design documents.
      Generates components, services, APIs, tests based on specifications.
    detection:
      any_of:
        - path: outputs/design
          type: directory_with_files
    prerequisites:
      required:
        - id: design_or_directive
          type: any_of
          items:
            - type: directory_with_files
              path: outputs/design
              description: Design documents (outputs/design/system/, ui/, spec/)
            - type: has_directive
              description: Task description entered via chat
      recommended:
        - id: codebase
          type: indexed_codebase
          description: Indexed codebase for consistent code style and patterns
    scope:
      - Code implementation (any language/framework)
      - File generation with proper structure
      - Import management
      - Test file generation
    outputs:
      - name: Source code files
        description: Implementation files based on design specifications

  - id: modification
    description: |
      Modifies or improves existing code.
      Handles refactoring, bug fixes, feature additions, optimizations.
    detection:
      all_of:
        - type: has_directive
        - none_of:
            - path: outputs/design
              type: directory_with_files
    prerequisites:
      required:
        - id: directive
          type: has_directive
          description: Change description entered via chat
      recommended:
        - id: codebase
          type: indexed_codebase
          description: Indexed codebase for accurate modifications
    scope:
      - Code modification and refactoring
      - Bug fixes
      - Feature additions
      - Performance optimizations
    outputs:
      - name: Modified source code
        description: Updated files with applied changes

redirect_signals:
  to_design: |
    Request has modification intent AND spans multiple boundaries (cross-layer, multiple concerns)
    AND the user has not pinned any reference document for this turn (`actionMetadata.refs` /
    `actionMetadata.context` empty). Auto-injected role-based artifacts in the workspace do NOT
    substitute for user-pinned references — only explicit per-turn pins count as "source supplied
    for this directive". Also redirects when the request explicitly targets a design artifact
    (specification, architecture document, UI spec). Pure explanation/analysis without modification
    intent stays in code job regardless of boundary count. See triage rules.md Step 6.2 for the
    decision matrix.
  to_learn: Request target is codebase analysis or indexing output
