# Job intent catalog (optional). An empty catalog costs nothing — the agent
# prompt simply carries no Intent Catalog section until you declare entries.
#
# There is no runtime classifier: a turn's intents are the `@intent:` mentions
# (or the execute body's `intents`), else the one entry marked `default: true`,
# else the reserved `general`. Each description is rendered verbatim into the
# agent's Intent Catalog as that situation's criterion; when an intent is
# active its `injections` files (this job's injections/*.md) are inlined in
# full (otherwise they stay in the on-demand table of contents). Example:
#
# intents:
#   - id: review
#     description: 'Review or critique an existing document in the workspace'
#     injections: [review-checklist.md]
#     default: true   # unpinned turns run as `review` (at most one per catalog)
version: 1
intents: []
