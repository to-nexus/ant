packages:
  - 'packages/*'
  # ant-cli: AI workflow backend + Cloud IDE (IDEService)
  # ant-ui: Frontend UI (SPA at /app)
  # ant-site: Marketing site (SSG at /)

allowBuilds:
  '@vscode/ripgrep': true
  sharp: true
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

# Trivy CI fix — 전이 의존성 CVE patch (pnpm 11 워크스페이스는 overrides 를 여기서만 인식)
overrides:
  handlebars: '^4.7.9'
  protobufjs: '^7.5.6'
  langsmith: '^0.6.0'
  lodash: '^4.18.1'
  '@isaacs/brace-expansion': '^5.0.1'
  picomatch: '^2.3.2'
  path-to-regexp: '^8.4.0'
  'minimatch@<10.2.3': '^10.2.3'
  'minimatch@<9.0.7 >=9': '^9.0.7'
  'minimatch@<5.1.8 >=5': '^5.1.8'
  'glob@<10.5.0 >=10': '^10.5.0'
