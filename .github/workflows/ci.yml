name: CI (OSS)

# Public OSS CI — verification only, NO secrets, NO deploy. The cloud deploy/CD
# pipelines (ECR/K8s/S3/Vault, IDE image) live in the private ant-cloud repo.
# This workflow guarantees the public tree builds and boots in local mode
# without the @ant/cloud overlay.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    # No redis service: the vitest suite has zero real-Redis clients (it stubs
    # in-process). Only boot-smoke needs a live instance. Adding one back here
    # just slows the job down.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm typecheck:cli
      - run: pnpm typecheck:ui
      # Test sources are excluded from tsconfig.json on purpose (it ships into
      # the runtime image — see packages/ant-cli/tsconfig.test.json). Without
      # this step a test can import a renamed path, build a task literal missing
      # a required field, or call a spy with arguments its signature does not
      # declare, and still pass — `import type` is erased by esbuild/vitest and
      # the rest never reaches a compiler. Blocking as of the 185 → 0 cleanup.
      - run: pnpm typecheck:tests
      - run: pnpm test:cli
      # ant-ui's suite (80 files / 677 cases) runs in ~4s. It was previously
      # typechecked but never executed in CI.
      - run: pnpm --filter @ant/ui test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      - run: pnpm build:ui:local
      # The OSS UI build must DCE all cloud chunks. Fail if any cloud marker leaks.
      - name: Assert no cloud chunks in OSS UI build
        run: |
          if grep -rqE "BillingCenterPanel|NavbarCreditMenu|OrganizationOnboardingScreen|refreshCatalog" packages/ant-ui/dist/assets 2>/dev/null; then
            echo "::error::Cloud UI content leaked into the OSS build"; exit 1
          fi
          echo "OSS UI build is cloud-free."

  # Secret scanning only. The seam invariants formerly re-checked here as shell
  # greps are owned by the vitest suite, which `typecheck-and-test` already runs:
  #   - static @ant/cloud imports   → tests/policy/no-cloud-static-import.test.ts
  #                                   (strips comment lines properly and matches all
  #                                    three import forms — the grep used a weaker
  #                                    line-prefix heuristic)
  #   - cloud overlay source absent → tests/policy/cloud-seam-composition.test.ts
  #                                   ("absent on disk" describe block)
  #   - tests/policy + tests/billing → covered by `pnpm test:cli`
  # Re-running them here duplicated ~62 test files per PR and let the two copies
  # of each rule drift. No node/pnpm setup either: gitleaks is a downloaded
  # binary and .gitleaks.toml allowlists node_modules/ + dist/ out of the scan.
  oss-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the gitleaks history scan below

      # Pinned version + sha256 of the release tarball. The binary runs with
      # repo contents in scope, so a compromised release asset would execute in
      # CI — verify before extracting. Bump VER and SHA together (the digest is
      # in gitleaks_<VER>_checksums.txt on the release page).
      - name: Install gitleaks
        run: |
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Secret scan (gitleaks, free CLI)
        # The gitleaks-action requires a GITLEAKS_LICENSE secret for org accounts.
        # Use the free open-source binary instead; config + allowlist in .gitleaks.toml.
        run: /tmp/gitleaks dir . -c .gitleaks.toml --no-banner --redact --exit-code 1

      # Full git-history scan of the CURRENT branch (HEAD ancestry only, via
      # --log-opts). Enabled after the history purge removed the leaked .env
      # backups from main. Scoped to HEAD — not all branches — so a dirty side
      # branch (e.g. an old branch carrying a fixture) can't fail main's gate;
      # the canonical branch is what this guarantees clean. Needs the full clone
      # (fetch-depth: 0 on the checkout above).
      - name: Secret scan — git history (gitleaks)
        run: /tmp/gitleaks git . --log-opts="HEAD" -c .gitleaks.toml --no-banner --redact --exit-code 1

  boot-smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ANT_SERVER_MODE: local
      ANT_REDIS_URL: redis://localhost:6379
      # ANT_ENCRYPTION_KEY is generated at runtime (see the "Generate ephemeral
      # encryption key" step) rather than hardcoded — an explicitly-set malformed
      # key now fails fast (P4 O6 / CredentialsStore), and committing a 64-hex
      # literal would trip secret scanners. The boot-smoke is ephemeral local mode,
      # so a fresh per-run key is fine (no credentials are persisted/read back).
      ANT_WORKSPACE_BASE_PATH: /tmp/ant-workspaces
      # server.ts binds process.env.PORT (default 8080); ANT_CLI_PORT is not read.
      PORT: "4100"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - name: Generate ephemeral encryption key
        run: echo "ANT_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Boot API server (local mode) and assert capabilities.billing === false
        run: |
          mkdir -p /tmp/ant-workspaces
          pnpm --filter @ant/cli exec tsx src/composition/server.ts &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4100/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          CONFIG=$(curl -sf http://localhost:4100/api/system/config)
          echo "system/config: $CONFIG"
          kill $SERVER_PID 2>/dev/null || true
          echo "$CONFIG" | node -e "const c=JSON.parse(require('fs').readFileSync(0,'utf8')); if(c.capabilities&&c.capabilities.billing===false){console.log('OK: billing capability is false in local mode')}else{console.error('FAIL: expected capabilities.billing===false, got',JSON.stringify(c.capabilities));process.exit(1)}"
