name: Deploy to K8s (Production)

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: false
        default: 'ant-ui'
        type: choice
        options:
          - ant-ui
      git_ref:
        description: 'Git reference (commit SHA, branch, or tag) to deploy'
        required: false
        type: string
        default: ''
      ticket_id:
        description: 'Jira ticket ID for deployment tracking'
        required: false
        type: string
        default: ''

  push:
    branches:
      - main
      - master
      - ci/*
    paths:
      - 'packages/ant-ui/**'
      - 'package.json'

  repository_dispatch:
    types: [release-deploy]

permissions:
  id-token: write
  contents: read

jobs:
  # sonarqube:
  #   name: SonarQube Analysis
  #   runs-on: ["arc-runner-set"]
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #     - name: SonarQube Scan
  #       uses: SonarSource/sonarqube-scan-action@v6
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ===========================================
  # 변경 감지 (Production)
  # ===========================================
  detect-changes:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/ci/')) && github.event_name == 'push'
    runs-on: ["arc-runner-set"]
    outputs:
      ant-ui-changed: ${{ steps.detect.outputs.ant-ui-changed }}
      root-package-changed: ${{ steps.detect.outputs.root-package-changed }}
      deploy-all: ${{ steps.detect.outputs.root-package-changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes by comparing commits
        id: detect
        run: |
          echo "🔍 Comparing ${{ github.event.before }} with ${{ github.sha }}"
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "📁 Changed files:"
          echo "$CHANGED_FILES"
          echo ""
          
          # Check root package.json changes (triggers all deploy)
          if echo "$CHANGED_FILES" | grep -q "^package.json$"; then
            echo "root-package-changed=true" >> $GITHUB_OUTPUT
            echo "✅ Root package.json changed - ALL DEPLOY TRIGGERED!"
          else
            echo "root-package-changed=false" >> $GITHUB_OUTPUT
            echo "❌ No root package.json changed"
          fi
          
          # Check ant-ui changes
          if echo "$CHANGED_FILES" | grep -q "^packages/ant-ui/"; then
            echo "ant-ui-changed=true" >> $GITHUB_OUTPUT
            echo "✅ ant-ui files changed"
          else
            echo "ant-ui-changed=false" >> $GITHUB_OUTPUT
            echo "❌ No ant-ui files changed"
          fi

  # ===========================================
  # Production 자동 배포 - ant-ui 변경 시
  # ===========================================
  auto-ant-ui-prod-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.ant-ui-changed == 'true' && needs.detect-changes.outputs.root-package-changed != 'true'
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: prod
      env: prod
      git_sha: ${{ github.sha }}
      service_name: ant-ui
      dockerfile: ./packages/ant-ui/Dockerfile
    secrets: inherit

  # ===========================================
  # Production 자동 배포 - root package.json 변경 시
  # ===========================================
  auto-all-ant-ui-prod-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.root-package-changed == 'true'
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: prod
      env: prod
      git_sha: ${{ github.sha }}
      service_name: ant-ui
      dockerfile: ./packages/ant-ui/Dockerfile
    secrets: inherit

  # ===========================================
  # 수동 배포 (Production)
  # ===========================================
  manual-ant-ui-deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.service == 'ant-ui'
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: prod
      env: prod
      git_sha: ${{ github.sha }}
      service_name: ant-ui
      ticket_id: ${{ github.event.inputs.ticket_id || '' }}
      git_ref: ${{ github.event.inputs.git_ref || '' }}
      dockerfile: ./packages/ant-ui/Dockerfile
    secrets: inherit

  # ===========================================
  # repository_dispatch를 통한 배포 (Production)
  # ===========================================
  release-deploy:
    if: github.event_name == 'repository_dispatch'
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: prod
      env: prod
      git_sha: ${{ github.sha }}
      service_name: ant-ui
      ticket_id: ${{ github.event.inputs.ticket_id || '' }}
      git_ref: ${{ github.event.inputs.git_ref || '' }}
      dockerfile: ./packages/ant-ui/Dockerfile
    secrets: inherit
