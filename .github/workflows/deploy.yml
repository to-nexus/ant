name: Deploy to K8s (ECR)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - stage
          - prod
      service:
        description: 'Service to deploy'
        required: false
        default: 'ant-ui'
        type: choice
        options:
          - ant-ui
          - ant-cli
          - ant-preview
          - ant-site
      git_ref:
        description: 'Git reference (commit SHA, branch, or tag) to deploy'
        required: false
        type: string
        default: ''
      ticket_id:
        description: 'Jira ticket ID for deployment tracking'
        required: false
        type: string
        default: ''

  push:
    branches:
      - main              # dev 환경 배포
      - dev               # dev 환경 배포
      - stage             # stage 환경 배포
      - cloud-scalability # dev 환경 배포
      - "ci/*"            # dev 환경 배포
    paths:
      - 'packages/ant-ui/**'
      - 'packages/ant-cli/**'
      - 'packages/ant-shared/**'
      - 'packages/ant-site/**'
      - 'package.json'

  repository_dispatch:
    types: [dev-deploy, stage-deploy, release-deploy]

permissions:
  id-token: write
  contents: read

jobs:
  # ===========================================
  # Detect changes in main, dev, stage, or ci branches
  # ===========================================
  detect-changes:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') || startsWith(github.ref, 'refs/heads/stage') || github.ref == 'refs/heads/cloud-scalability' || startsWith(github.ref, 'refs/heads/ci/')) && github.event_name == 'push'
    runs-on: ["arc-runner-set"]
    outputs:
      ant-ui-changed: ${{ steps.detect.outputs.ant-ui-changed }}
      ant-cli-changed: ${{ steps.detect.outputs.ant-cli-changed }}
      ant-site-changed: ${{ steps.detect.outputs.ant-site-changed }}
      root-package-changed: ${{ steps.detect.outputs.root-package-changed }}
      deploy-all: ${{ steps.detect.outputs.root-package-changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes by comparing commits
        id: detect
        run: |
          echo "🔍 Comparing ${{ github.event.before }} with ${{ github.sha }}"
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "📁 Changed files:"
          echo "$CHANGED_FILES"
          echo ""
          
          # Check root package.json changes (triggers all deploy)
          if echo "$CHANGED_FILES" | grep -q "^package.json$"; then
            echo "root-package-changed=true" >> $GITHUB_OUTPUT
            echo "✅ Root package.json changed - ALL DEPLOY TRIGGERED!"
          else
            echo "root-package-changed=false" >> $GITHUB_OUTPUT
            echo "❌ No root package.json changed"
          fi
          
          # Check ant-ui changes
          if echo "$CHANGED_FILES" | grep -q "^packages/ant-ui/"; then
            echo "ant-ui-changed=true" >> $GITHUB_OUTPUT
            echo "✅ ant-ui files changed"
          else
            echo "ant-ui-changed=false" >> $GITHUB_OUTPUT
            echo "❌ No ant-ui files changed"
          fi
          
          # Check ant-shared changes (triggers ant-cli + ant-preview rebuild)
          if echo "$CHANGED_FILES" | grep -q "^packages/ant-shared/"; then
            ANT_SHARED_CHANGED=true
            echo "✅ ant-shared files changed (will trigger ant-cli rebuild)"
          else
            ANT_SHARED_CHANGED=false
            echo "❌ No ant-shared files changed"
          fi
          
          # Check ant-cli changes (also triggered by ant-shared changes)
          if echo "$CHANGED_FILES" | grep -q "^packages/ant-cli/" || [ "$ANT_SHARED_CHANGED" = "true" ]; then
            echo "ant-cli-changed=true" >> $GITHUB_OUTPUT
            echo "✅ ant-cli files changed (or ant-shared dependency changed)"
          else
            echo "ant-cli-changed=false" >> $GITHUB_OUTPUT
            echo "❌ No ant-cli files changed"
          fi
          
          # Check ant-site changes
          if echo "$CHANGED_FILES" | grep -q "^packages/ant-site/"; then
            echo "ant-site-changed=true" >> $GITHUB_OUTPUT
            echo "✅ ant-site files changed"
          else
            echo "ant-site-changed=false" >> $GITHUB_OUTPUT
            echo "❌ No ant-site files changed"
          fi

  # ===========================================
  # Dev environment - ant-ui deployment (S3 static upload)
  # ===========================================
  auto-ant-ui-dev-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.ant-ui-changed == 'true' && needs.detect-changes.outputs.root-package-changed != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') || github.ref == 'refs/heads/cloud-scalability' || startsWith(github.ref, 'refs/heads/ci/'))
    runs-on: ["arc-runner-set"]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Install AWS CLI
        run: |
          if ! type aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install && rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
      - run: pnpm build:shared
      - run: pnpm build:ui
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AX_S3_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - name: Deploy to S3 + invalidate CloudFront
        run: |
          aws s3 sync packages/ant-ui/dist/ s3://${{ vars.ANT_UI_S3_BUCKET }}/app/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.ANT_UI_CF_DISTRIBUTION_ID }} --paths "/app/*"

  # ===========================================
  # Dev environment - ant-cli deployment (main, dev, ci/* branches)
  # ant-cli 이미지: ant-api, ant-job 워커용 (언어 런타임 없는 경량 이미지)
  # ===========================================
  auto-ant-cli-dev-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.ant-cli-changed == 'true' && needs.detect-changes.outputs.root-package-changed != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') || github.ref == 'refs/heads/cloud-scalability' || startsWith(github.ref, 'refs/heads/ci/'))
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: dev
      env: dev
      git_sha: ${{ github.sha }}
      service_name: ant-cli
      dockerfile: ./packages/ant-cli/Dockerfile
    secrets: inherit

  # ===========================================
  # Dev environment - ant-preview deployment (main, dev, ci/* branches)
  # ant-preview 이미지: preview 워커 전용 (멀티 언어 런타임 포함)
  # ===========================================
  auto-ant-preview-dev-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.ant-cli-changed == 'true' && needs.detect-changes.outputs.root-package-changed != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') || github.ref == 'refs/heads/cloud-scalability' || startsWith(github.ref, 'refs/heads/ci/'))
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: dev
      env: dev
      git_sha: ${{ github.sha }}
      service_name: ant-preview
      dockerfile: ./packages/ant-cli/Dockerfile
      target: preview
      build_args: |
        GO_VERSION=${{ vars.PREVIEW_GO_VERSION }}
        PYTHON_VERSION=${{ vars.PREVIEW_PYTHON_VERSION }}
        RUST_VERSION=${{ vars.PREVIEW_RUST_VERSION }}
        JAVA_VERSION=${{ vars.PREVIEW_JAVA_VERSION }}
    secrets: inherit

  # ===========================================
  # Dev environment - ant-site deployment (S3 static upload)
  # ===========================================
  auto-ant-site-dev-deploy:
    needs: detect-changes
    if: (needs.detect-changes.outputs.ant-site-changed == 'true' || needs.detect-changes.outputs.root-package-changed == 'true') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') || github.ref == 'refs/heads/cloud-scalability' || startsWith(github.ref, 'refs/heads/ci/'))
    runs-on: ["arc-runner-set"]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Install AWS CLI
        run: |
          if ! type aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install && rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
      - run: pnpm build:site
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AX_S3_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - name: Deploy to S3 + invalidate CloudFront
        run: |
          aws s3 sync packages/ant-site/out/ s3://${{ vars.ANT_SITE_S3_BUCKET }}/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.ANT_SITE_CF_DISTRIBUTION_ID }} --paths "/*"

  # ===========================================
  # Dev environment - Deploy all when root package.json changes (main, dev, ci/* branches)
  # ===========================================
  auto-all-ant-ui-dev-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.root-package-changed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') || github.ref == 'refs/heads/cloud-scalability' || startsWith(github.ref, 'refs/heads/ci/'))
    runs-on: ["arc-runner-set"]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Install AWS CLI
        run: |
          if ! type aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install && rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
      - run: pnpm build:shared
      - run: pnpm build:ui
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AX_S3_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - name: Deploy to S3 + invalidate CloudFront
        run: |
          aws s3 sync packages/ant-ui/dist/ s3://${{ vars.ANT_UI_S3_BUCKET }}/app/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.ANT_UI_CF_DISTRIBUTION_ID }} --paths "/app/*"

  auto-all-ant-cli-dev-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.root-package-changed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') || github.ref == 'refs/heads/cloud-scalability' || startsWith(github.ref, 'refs/heads/ci/'))
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: dev
      env: dev
      git_sha: ${{ github.sha }}
      service_name: ant-cli
      dockerfile: ./packages/ant-cli/Dockerfile
    secrets: inherit

  auto-all-ant-preview-dev-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.root-package-changed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev') || github.ref == 'refs/heads/cloud-scalability' || startsWith(github.ref, 'refs/heads/ci/'))
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: dev
      env: dev
      git_sha: ${{ github.sha }}
      service_name: ant-preview
      dockerfile: ./packages/ant-cli/Dockerfile
      target: preview
      build_args: |
        GO_VERSION=${{ vars.PREVIEW_GO_VERSION }}
        PYTHON_VERSION=${{ vars.PREVIEW_PYTHON_VERSION }}
        RUST_VERSION=${{ vars.PREVIEW_RUST_VERSION }}
        JAVA_VERSION=${{ vars.PREVIEW_JAVA_VERSION }}
    secrets: inherit

  # ===========================================
  # Stage branch - ant-ui deployment (S3 static upload)
  # ===========================================
  auto-ant-ui-stage-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.ant-ui-changed == 'true' && needs.detect-changes.outputs.root-package-changed != 'true' && startsWith(github.ref, 'refs/heads/stage')
    runs-on: ["arc-runner-set"]
    environment: stage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Install AWS CLI
        run: |
          if ! type aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install && rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
      - run: pnpm build:shared
      - run: pnpm build:ui
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AX_S3_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - name: Deploy to S3 + invalidate CloudFront
        run: |
          aws s3 sync packages/ant-ui/dist/ s3://${{ vars.ANT_UI_S3_BUCKET }}/app/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.ANT_UI_CF_DISTRIBUTION_ID }} --paths "/app/*"

  # ===========================================
  # Stage branch - ant-cli deployment
  # ===========================================
  auto-ant-cli-stage-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.ant-cli-changed == 'true' && needs.detect-changes.outputs.root-package-changed != 'true' && startsWith(github.ref, 'refs/heads/stage')
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: stage
      env: stage
      git_sha: ${{ github.sha }}
      service_name: ant-cli
      dockerfile: ./packages/ant-cli/Dockerfile
    secrets: inherit

  # ===========================================
  # Stage branch - ant-site deployment (S3 static upload)
  # ===========================================
  auto-ant-site-stage-deploy:
    needs: detect-changes
    if: (needs.detect-changes.outputs.ant-site-changed == 'true' || needs.detect-changes.outputs.root-package-changed == 'true') && startsWith(github.ref, 'refs/heads/stage')
    runs-on: ["arc-runner-set"]
    environment: stage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Install AWS CLI
        run: |
          if ! type aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install && rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
      - run: pnpm build:site
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AX_S3_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - name: Deploy to S3 + invalidate CloudFront
        run: |
          aws s3 sync packages/ant-site/out/ s3://${{ vars.ANT_SITE_S3_BUCKET }}/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.ANT_SITE_CF_DISTRIBUTION_ID }} --paths "/*"

  # ===========================================
  # Stage branch - ant-preview deployment
  # ===========================================
  auto-ant-preview-stage-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.ant-cli-changed == 'true' && needs.detect-changes.outputs.root-package-changed != 'true' && startsWith(github.ref, 'refs/heads/stage')
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: stage
      env: stage
      git_sha: ${{ github.sha }}
      service_name: ant-preview
      dockerfile: ./packages/ant-cli/Dockerfile
      target: preview
      build_args: |
        GO_VERSION=${{ vars.PREVIEW_GO_VERSION }}
        PYTHON_VERSION=${{ vars.PREVIEW_PYTHON_VERSION }}
        RUST_VERSION=${{ vars.PREVIEW_RUST_VERSION }}
        JAVA_VERSION=${{ vars.PREVIEW_JAVA_VERSION }}
    secrets: inherit

  # ===========================================
  # Stage branch - Deploy all when root package.json changes
  # ===========================================
  auto-all-ant-ui-stage-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.root-package-changed == 'true' && startsWith(github.ref, 'refs/heads/stage')
    runs-on: ["arc-runner-set"]
    environment: stage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Install AWS CLI
        run: |
          if ! type aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install && rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
      - run: pnpm build:shared
      - run: pnpm build:ui
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AX_S3_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - name: Deploy to S3 + invalidate CloudFront
        run: |
          aws s3 sync packages/ant-ui/dist/ s3://${{ vars.ANT_UI_S3_BUCKET }}/app/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.ANT_UI_CF_DISTRIBUTION_ID }} --paths "/app/*"

  auto-all-ant-cli-stage-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.root-package-changed == 'true' && startsWith(github.ref, 'refs/heads/stage')
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: stage
      env: stage
      git_sha: ${{ github.sha }}
      service_name: ant-cli
      dockerfile: ./packages/ant-cli/Dockerfile
    secrets: inherit

  auto-all-ant-preview-stage-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.root-package-changed == 'true' && startsWith(github.ref, 'refs/heads/stage')
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: stage
      env: stage
      git_sha: ${{ github.sha }}
      service_name: ant-preview
      dockerfile: ./packages/ant-cli/Dockerfile
      target: preview
      build_args: |
        GO_VERSION=${{ vars.PREVIEW_GO_VERSION }}
        PYTHON_VERSION=${{ vars.PREVIEW_PYTHON_VERSION }}
        RUST_VERSION=${{ vars.PREVIEW_RUST_VERSION }}
        JAVA_VERSION=${{ vars.PREVIEW_JAVA_VERSION }}
    secrets: inherit

  # ===========================================
  # Manual deployment workflow - ant-ui (dev, stage only)
  # ===========================================
  manual-ant-ui-deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.service == 'ant-ui' && github.event.inputs.environment != 'prod'
    runs-on: ["arc-runner-set"]
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Install AWS CLI
        run: |
          if ! type aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install && rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
      - run: pnpm build:shared
      - run: pnpm build:ui
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AX_S3_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - name: Deploy to S3 + invalidate CloudFront
        run: |
          aws s3 sync packages/ant-ui/dist/ s3://${{ vars.ANT_UI_S3_BUCKET }}/app/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.ANT_UI_CF_DISTRIBUTION_ID }} --paths "/app/*"

  # ===========================================
  # Manual deployment workflow - ant-site (dev, stage only)
  # ===========================================
  manual-ant-site-deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.service == 'ant-site' && github.event.inputs.environment != 'prod'
    runs-on: ["arc-runner-set"]
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Install AWS CLI
        run: |
          if ! type aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install && rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
      - run: pnpm build:site
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AX_S3_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - name: Deploy to S3 + invalidate CloudFront
        run: |
          aws s3 sync packages/ant-site/out/ s3://${{ vars.ANT_SITE_S3_BUCKET }}/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.ANT_SITE_CF_DISTRIBUTION_ID }} --paths "/*"

  # ===========================================
  # Manual deployment workflow - ant-cli (dev, stage only)
  # ===========================================
  manual-ant-cli-deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.service == 'ant-cli' && github.event.inputs.environment != 'prod'
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: ${{ github.event.inputs.environment }}
      env: ${{ github.event.inputs.environment }}
      git_sha: ${{ github.sha }}
      service_name: ant-cli
      ticket_id: ${{ github.event.inputs.ticket_id || '' }}
      git_ref: ${{ github.event.inputs.git_ref || '' }}
      dockerfile: ./packages/ant-cli/Dockerfile
    secrets: inherit

  # ===========================================
  # Manual deployment workflow - ant-preview (dev, stage only)
  # ===========================================
  manual-ant-preview-deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.service == 'ant-preview' && github.event.inputs.environment != 'prod'
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: ${{ github.event.inputs.environment }}
      env: ${{ github.event.inputs.environment }}
      git_sha: ${{ github.sha }}
      service_name: ant-preview
      ticket_id: ${{ github.event.inputs.ticket_id || '' }}
      git_ref: ${{ github.event.inputs.git_ref || '' }}
      dockerfile: ./packages/ant-cli/Dockerfile
      target: preview
      build_args: |
        GO_VERSION=${{ vars.PREVIEW_GO_VERSION }}
        PYTHON_VERSION=${{ vars.PREVIEW_PYTHON_VERSION }}
        RUST_VERSION=${{ vars.PREVIEW_RUST_VERSION }}
        JAVA_VERSION=${{ vars.PREVIEW_JAVA_VERSION }}
    secrets: inherit

  # ===========================================
  # Release (prod) deployment via repository_dispatch or workflow_dispatch
  # ===========================================
  release-deploy-ant-ui:
    if: >
      (github.event_name == 'repository_dispatch' && github.event.inputs.environment == 'prod') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.service == 'ant-ui')
    runs-on: ["arc-runner-set"]
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Install AWS CLI
        run: |
          if ! type aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install && rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
      - run: pnpm build:shared
      - run: pnpm build:ui
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AX_S3_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - name: Deploy to S3 + invalidate CloudFront
        run: |
          aws s3 sync packages/ant-ui/dist/ s3://${{ vars.ANT_UI_S3_BUCKET }}/app/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.ANT_UI_CF_DISTRIBUTION_ID }} --paths "/app/*"

  release-deploy-ant-site:
    if: >
      (github.event_name == 'repository_dispatch' && github.event.inputs.environment == 'prod') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.service == 'ant-site')
    runs-on: ["arc-runner-set"]
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Install AWS CLI
        run: |
          if ! type aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install && rm -rf /tmp/awscliv2.zip /tmp/aws
          fi
      - run: pnpm build:site
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AX_S3_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - name: Deploy to S3 + invalidate CloudFront
        run: |
          aws s3 sync packages/ant-site/out/ s3://${{ vars.ANT_SITE_S3_BUCKET }}/ --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.ANT_SITE_CF_DISTRIBUTION_ID }} --paths "/*"

  release-deploy-ant-cli:
    if: >
      (github.event_name == 'repository_dispatch' && github.event.inputs.environment == 'prod') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.service == 'ant-cli')
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: prod
      env: prod
      git_sha: ${{ github.sha }}
      service_name: ant-cli
      ticket_id: ${{ github.event.inputs.ticket_id || '' }}
      git_ref: ${{ github.event.inputs.git_ref || '' }}
      dockerfile: ./packages/ant-cli/Dockerfile
    secrets: inherit

  release-deploy-ant-preview:
    if: >
      (github.event_name == 'repository_dispatch' && github.event.inputs.environment == 'prod') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.service == 'ant-preview')
    uses: to-nexus/cross-hub-workflows/.github/workflows/ant.yml@master
    with:
      environment: prod
      env: prod
      git_sha: ${{ github.sha }}
      service_name: ant-preview
      ticket_id: ${{ github.event.inputs.ticket_id || '' }}
      git_ref: ${{ github.event.inputs.git_ref || '' }}
      dockerfile: ./packages/ant-cli/Dockerfile
      target: preview
      build_args: |
        GO_VERSION=${{ vars.PREVIEW_GO_VERSION }}
        PYTHON_VERSION=${{ vars.PREVIEW_PYTHON_VERSION }}
        RUST_VERSION=${{ vars.PREVIEW_RUST_VERSION }}
        JAVA_VERSION=${{ vars.PREVIEW_JAVA_VERSION }}
    secrets: inherit
