name: Build IDE image

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - packages/ant-cli/Dockerfile.ide
      - packages/ant-cli/docker/ide/**
      - .github/workflows/build-ide-image.yml
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [dev, stage, prod]
        default: dev

permissions:
  id-token: write
  contents: read

env:
  ECR_REGISTRY: 412381771241.dkr.ecr.ap-northeast-2.amazonaws.com
  SERVICE_NAME: ant-ide
  TARGET_ENV: ${{ github.event.inputs.env || 'dev' }}

jobs:
  security-scan:
    uses: to-nexus/cross-hub-workflows/.github/workflows/security-scan.yml@master
    with:
      severity: 'CRITICAL,HIGH'

  build-and-push:
    needs: security-scan
    runs-on:
      - codebuild-cross-gha-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "412381771241"

      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ECR_REPO="${{ env.ECR_REGISTRY }}/${{ env.TARGET_ENV }}/${{ env.SERVICE_NAME }}"
          echo "image_sha=${ECR_REPO}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${ECR_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -f packages/ant-cli/Dockerfile.ide \
            -t "${{ steps.tags.outputs.image_sha }}" \
            -t "${{ steps.tags.outputs.image_latest }}" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.tags.outputs.image_sha }}"
          docker push "${{ steps.tags.outputs.image_latest }}"
