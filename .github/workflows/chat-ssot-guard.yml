name: chat-SSOT guard

on:
  pull_request:
    paths:
      - "packages/**"
      - "scripts/check-no-legacy-chat.mjs"
      - ".github/workflows/chat-ssot-guard.yml"
  push:
    branches:
      - main
      - dev
      - "ci/*"
    paths:
      - "packages/**"
      - "scripts/check-no-legacy-chat.mjs"
      - ".github/workflows/chat-ssot-guard.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ===========================================
  # chat-SSOT §14 negative-grep guard
  # -------------------------------------------
  # Fails the build whenever the legacy ChatMessage / MessageContent /
  # ChatSession envelope (or any of its supporting endpoints / store
  # actions / Redis keys) reappears in production code. See
  # `.cursor/plans/chat-ssot-unification_be4c8599.plan.md` §D.5 and the
  # `scripts/check-no-legacy-chat.mjs` source for the full pattern list.
  # ===========================================
  chat-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run chat-SSOT negative-grep guard
        run: node scripts/check-no-legacy-chat.mjs

  # ===========================================
  # FE chat tests — selectTurns / SSE gating projector contract.
  # -------------------------------------------
  # Runs the targeted FE unit suite that locks the chat-SSOT projector
  # invariants (Phase 13 §D.4 scenarios). Kept narrow on purpose so the
  # guard is fast and stable.
  # ===========================================
  fe-chat-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:shared
      - name: chat projector tests
        run: pnpm --filter @ant/ui exec vitest run tests/chat/
