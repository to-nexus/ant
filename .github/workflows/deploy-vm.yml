name: Deploy to VM (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
        - embedder

  push:
    branches:
      - main
      - master
      - dev
      - "ci/*"
    paths:
      - 'packages/ant-cli/src/periphery/integrations/vector-memory/embedder/**'

jobs:
  # ===========================================
  # 변경 감지
  # ===========================================
  detect-changes:
    runs-on: [ax-ant-dev]
    if: github.event_name == 'push'
    outputs:
      embedder-changed: ${{ steps.detect.outputs.embedder-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "")
          
          echo "📁 Changed files:"
          echo "$CHANGED_FILES"
          echo ""
          
          # embedder 변경 체크
          EMBEDDER_PATH="packages/ant-cli/src/periphery/integrations/vector-memory/embedder/"
          if echo "$CHANGED_FILES" | grep -q "^${EMBEDDER_PATH}"; then
            echo "embedder-changed=true" >> $GITHUB_OUTPUT
            echo "✅ embedder changed"
          else
            echo "embedder-changed=false" >> $GITHUB_OUTPUT
            echo "❌ embedder not changed"
          fi

  # ===========================================
  # embedder 배포 (chroma-db VM runner에서 직접 빌드)
  # ===========================================
  deploy-embedder:
    name: Deploy embedder
    runs-on: [ax-ant-embedder-dev]  # chroma-db VM의 self-hosted runner
    needs: [detect-changes]
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.service == 'embedder') ||
        (github.event_name == 'push' && needs.detect-changes.outputs.embedder-changed == 'true')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync embedder source
        run: |
          echo "📁 Embedder 소스 동기화 중..."
          sudo mkdir -p /cross/embedder
          sudo cp packages/ant-cli/src/periphery/integrations/vector-memory/embedder/Dockerfile /cross/embedder/
          sudo cp packages/ant-cli/src/periphery/integrations/vector-memory/embedder/embed_server.py /cross/embedder/
          
          # embedder 전용 docker-compose.yml 생성
          sudo tee /cross/embedder/docker-compose.yml > /dev/null << 'EOFCOMPOSE'
          services:
            embedder:
              build:
                context: .
                dockerfile: Dockerfile
              image: embedder:latest
              container_name: embedder
              hostname: embedder
              network_mode: host
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 30s
          EOFCOMPOSE
          
          sudo chown -R cross:cross /cross/embedder

      - name: Build and Deploy embedder
        working-directory: /cross/embedder
        run: |
          echo "🔨 Docker 빌드 중..."
          sudo docker compose build --no-cache embedder
          
          echo "🗑️ 기존 컨테이너 정리..."
          sudo docker rm -f embedder 2>/dev/null || true
          
          echo "🔄 컨테이너 시작..."
          sudo docker compose up -d embedder
          
          echo "🧹 오래된 이미지 정리..."
          sudo docker image prune -f

      - name: Health Check
        run: |
          echo "🏥 Health check 대기 중..."
          sleep 30
          
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Embedder health check passed!"
              exit 0
            fi
            echo "⏳ Waiting... ($i/6) - Status: $STATUS"
            sleep 10
          done
          
          echo "❌ Embedder health check failed"
          sudo docker compose -f /cross/embedder/docker-compose.yml logs embedder
          exit 1

      - name: Show Status
        if: always()
        run: |
          echo "📊 컨테이너 상태:"
          sudo docker compose -f /cross/embedder/docker-compose.yml ps

  # ===========================================
  # 배포 완료 알림 (Slack)
  # ===========================================
  notify:
    needs: [deploy-embedder]
    runs-on: [ax-ant-dev]
    if: always()
    steps:
      - name: Set deployment status
        id: status
        run: |
          EMBEDDER_RESULT="${{ needs.deploy-embedder.result || 'skipped' }}"
          
          # 전체 결과 판단
          if [[ "$EMBEDDER_RESULT" == "failure" ]]; then
            echo "overall=failure" >> $GITHUB_OUTPUT
            echo "color=#FF0000" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          elif [[ "$EMBEDDER_RESULT" == "success" ]]; then
            echo "overall=success" >> $GITHUB_OUTPUT
            echo "color=#36A64F" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "overall=skipped" >> $GITHUB_OUTPUT
            echo "color=#808080" >> $GITHUB_OUTPUT
            echo "emoji=⏭️" >> $GITHUB_OUTPUT
          fi
          
          # 결과 이모지 매핑
          echo "embedder_emoji=$([[ "$EMBEDDER_RESULT" == "success" ]] && echo "✅" || ([[ "$EMBEDDER_RESULT" == "failure" ]] && echo "❌" || echo "⏭️"))" >> $GITHUB_OUTPUT

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} ANT VM 배포 ${{ steps.status.outputs.overall }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.emoji }} ANT VM 배포 결과",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n`${{ github.ref_name }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*embedder:*\n${{ steps.status.outputs.embedder_emoji }} ${{ needs.deploy-embedder.result || 'skipped' }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Actor:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                    }
                  ]
                }
              ],
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}"
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
