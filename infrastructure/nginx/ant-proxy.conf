# ant.crosstoken.io Nginx Configuration (Production)
# Requires: nginx with Lua module (openresty or nginx-extras)
# Redis: Store project ID → port mappings

upstream ant_ui {
    server 127.0.0.1:8080;
}

upstream ant_api {
    server 127.0.0.1:3000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name ant.crosstoken.io;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name ant.crosstoken.io;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/ant.crosstoken.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ant.crosstoken.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ant-ui (Frontend)
    location / {
        proxy_pass http://ant_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ant-cli API
    location /api/ {
        proxy_pass http://ant_api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeout for long-running jobs
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Dev Server Proxy (Dynamic Port Resolution)
    # /dev/user1-project-abc → Redis lookup → localhost:30001
    location ~ ^/dev/([a-zA-Z0-9_-]+)$ {
        set $project_id $1;
        
        # Lua script to query Redis for port mapping
        set_by_lua_block $backend_port {
            local redis = require "resty.redis"
            local red = redis:new()
            
            red:set_timeouts(1000, 1000, 1000) -- 1 sec timeout
            
            local ok, err = red:connect("127.0.0.1", 6379)
            if not ok then
                ngx.log(ngx.ERR, "Failed to connect to Redis: ", err)
                return "8080" -- Fallback to ant-ui
            end
            
            -- Key format: ant:ports:tenant-id:project-id
            local port, err = red:hget("dev-servers", ngx.var.project_id)
            if not port or port == ngx.null then
                ngx.log(ngx.WARN, "No port found for project: ", ngx.var.project_id)
                return "8080" -- Fallback
            end
            
            ngx.log(ngx.INFO, "Project ", ngx.var.project_id, " → port ", port)
            return port
        }
        
        # Proxy to dynamically resolved port
        proxy_pass http://127.0.0.1:$backend_port;
        proxy_http_version 1.1;
        
        # WebSocket support (for HMR - Hot Module Replacement)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS for dev servers (if needed)
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        # Handle preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Cloud IDE Proxy (User-specific VS Code Server)
    # /ide/user1-project-abc → Docker container port
    location ~ ^/ide/([a-zA-Z0-9_-]+)$ {
        set $ide_id $1;
        
        set_by_lua_block $ide_port {
            local redis = require "resty.redis"
            local red = redis:new()
            
            red:set_timeouts(1000, 1000, 1000)
            
            local ok, err = red:connect("127.0.0.1", 6379)
            if not ok then
                ngx.log(ngx.ERR, "Failed to connect to Redis: ", err)
                return "8080"
            end
            
            local port, err = red:hget("ides", ngx.var.ide_id)
            if not port or port == ngx.null then
                ngx.log(ngx.WARN, "No IDE port found for: ", ngx.var.ide_id)
                return "8080"
            end
            
            return port
        }
        
        proxy_pass http://127.0.0.1:$ide_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # VS Code Server needs long timeouts
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
