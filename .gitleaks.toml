# OSS CI secret-scan config — consumed by the free gitleaks CLI in
# .github/workflows/ci.yml (replaces the licensed gitleaks-action, which requires
# a GITLEAKS_LICENSE secret for organization accounts).
#
# Keep the full default ruleset; only exclude dependency/build/local-only trees
# and a clearly-fake unit-test fixture. Do NOT allowlist real secrets here.

[extend]
useDefault = true

[allowlist]
description = "Exclude deps/build/local-only trees and a known test fixture (not a real secret)."
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)\.git/''',
  '''(^|/)\.openvscode-server/''',
  '''(^|/)docs/tmp/''',
  '''(^|/)workspace/''',
  # Next.js build output for ant-site — gitignored, but `gitleaks dir` also
  # walks untracked files and its manifests trip generic-api-key on build hashes.
  '''(^|/)\.next/''',
]
regexes = [
  # Placeholder key in packages/ant-cli/tests/http/cookie-domain-derivation.test.ts
  # — the literal string is its own proof it is not a real credential.
  '''test-secret-at-least-32-characters-long-xx''',
  # Prompt-template example key in the node-api rules template (history only)
  # — a self-evidently fake placeholder, not a real credential.
  '''sk-1234567890abcdef''',
  # RFC 6455 §1.3's published sample `Sec-WebSocket-Key` (base64 of "the sample
  # nonce"), used in tests/policy/credential-isolation.test.ts to assert the
  # handshake headers survive the proxy rewrite. A handshake nonce is not a
  # credential, and this one is a spec constant.
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  # Fixture path in tests/policy/untrusted-path-containment.test.ts — a symlink
  # target name, matched only by generic-api-key's base64-shaped branch.
  '''jump/existing''',
]
