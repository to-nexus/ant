# ANT — self-hosted cloud override (multi-user, Google sign-in, NO billing).
#
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d
#
# Requires a .env (or exported shell vars) with at least:
#   ANT_JWT_PUBLIC_KEY + ANT_JWT_PRIVATE_KEY (or ANT_JWT_SECRET — see below),
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# See docs/guides/self-host-cloud.md for the full checklist.
#
# YAML anchors are file-local, so this file cannot merge into the base's
# `x-ant-env-common` anchor. Instead each ant service sets its own
# `environment:` keys — compose merges per-service environment maps key-wise,
# so ANT_REDIS_URL / ANT_WORKSPACE_BASE_PATH etc. from the base still apply.
#
# ANT_REQUIRE_BILLING is deliberately NOT set here — it is reserved for the
# managed deployment (fails boot when the @ant/cloud billing overlay is
# absent). Self-hosted cloud runs unmetered.
#
# Secrets are scoped to the services that CONSUME them, not applied uniformly.
# ant-preview spawns user-authored install and dev commands, and those children
# share its UID and process namespace — so anything in that service's
# environment is reachable from user code via /proc. Sign-in secrets have no
# consumer there, so they are not granted there (report C-001).
#
# The session key follows the same rule, but needs asymmetric keys to do it: a
# verifier that holds an HS256 secret can also MINT sessions. Generate a P-256
# pair once and put the private half on ant-api only:
#
#   openssl ecparam -genkey -name prime256v1 -noout \
#     | openssl pkcs8 -topk8 -nocrypt -out jwt-private.pem
#   openssl ec -in jwt-private.pem -pubout -out jwt-public.pem
#   ANT_JWT_PRIVATE_KEY="$(cat jwt-private.pem)"
#   ANT_JWT_PUBLIC_KEY="$(cat jwt-public.pem)"
#
# The HS256 `ANT_JWT_SECRET` path still works for a single-host deployment, but
# ant-realtime / ant-preview then refuse to boot unless
# ANT_JWT_ALLOW_SYMMETRIC=true records that the risk is accepted.
# Child UID isolation (ANT_CHILD_UID/GID below) is the complementary control.

# Every ant service: mode + the origin CORS and cookie derivation read.
x-ant-env-cloud-base: &ant-env-cloud-base
  ANT_SERVER_MODE: cloud
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}

# Session VERIFICATION for a process that runs NO user-authored code
# (ant-realtime). The ES256 public key carries no minting authority. The HS256
# secret is the symmetric single-host fallback, gated by ANT_JWT_ALLOW_SYMMETRIC
# at boot. It is deliberately NOT given to ant-preview: that process spawns user
# code under its own UID, so a secret there is /proc-readable session forgery
# (C-001, M-NEW-013) and its boot gate ('verify-usercode') refuses it outright.
x-ant-env-cloud-verify: &ant-env-cloud-verify
  ANT_JWT_PUBLIC_KEY: ${ANT_JWT_PUBLIC_KEY:-}
  ANT_JWT_SECRET: ${ANT_JWT_SECRET:-}
  ANT_JWT_ALLOW_SYMMETRIC: ${ANT_JWT_ALLOW_SYMMETRIC:-}

# Session VERIFICATION for a process that spawns user-authored code
# (ant-preview). Public key ONLY — no symmetric secret, no opt-out. A symmetric
# single-host deployment cannot run preview; it must migrate to an ES256 key pair.
x-ant-env-cloud-verify-pubonly: &ant-env-cloud-verify-pubonly
  ANT_JWT_PUBLIC_KEY: ${ANT_JWT_PUBLIC_KEY:-}

# Session SIGNING. Consumed ONLY by ant-api, the only process that mounts the
# auth router and therefore the only one that mints a session.
x-ant-env-cloud-sign: &ant-env-cloud-sign
  ANT_JWT_PRIVATE_KEY: ${ANT_JWT_PRIVATE_KEY:-}

# Sign-in and administration. Consumed ONLY by ant-api, which is the only
# process that mounts the auth and admin routers.
x-ant-env-cloud-identity: &ant-env-cloud-identity
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env (Google Cloud Console OAuth client)}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env (Google Cloud Console OAuth client)}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}   # empty = derived as ${FRONTEND_URL}/api/auth/google/callback
  ANT_SUPER_ADMIN_EMAILS: ${ANT_SUPER_ADMIN_EMAILS:-}

services:
  ant-api:
    environment:
      <<: [*ant-env-cloud-base, *ant-env-cloud-verify, *ant-env-cloud-sign, *ant-env-cloud-identity]

  ant-realtime:
    environment:
      <<: [*ant-env-cloud-base, *ant-env-cloud-verify]

  # No HTTP surface → verifies nothing, signs nothing.
  ant-job:
    environment:
      <<: *ant-env-cloud-base

  # Verifies proxy ownership; never serves sign-in. Runs user-authored code, so
  # it receives the public key ONLY (no symmetric secret / opt-out).
  ant-preview:
    environment:
      <<: [*ant-env-cloud-base, *ant-env-cloud-verify-pubonly]
