# ANT single-origin gateway for docker-compose (:4200).
#
# Serves the SPA under /app/ and proxies everything else to the right ant
# process, making the same-origin layout (VITE_CLOUD_BACKEND_BASE= and
# VITE_PREVIEW_HOST= empty) work without a Vite dev server:
#
#   /app/      → SPA static files (Vite base '/app/')
#   /api/      → ant-api      :4100  (health lives at /api/health)
#   /ide       → ant-api      :4100  (WebSocket upgrade)
#   /realtime  → ant-realtime :4101  (SSE — buffering off, long timeout)
#   /bridge    → ant-realtime :4101  (desktop bridge, WebSocket upgrade)
#   /preview/  → ant-preview  :4102  (management API — control plane)
#
# A SECOND server block on :8081 (published as :4201) serves preview and deploy
# CONTENT from ant-preview :4103. It is a different origin from the app above on
# purpose: the content origin serves attacker-authorable documents (a public
# deploy's build output, a user's dev server), and sharing an origin with the
# `/api/*` and `/projects/*` control planes let script in such a document drive
# them with the viewer's session (report H-NEW-001). Point
# VITE_PREVIEW_CONTENT_HOST at http://localhost:4201.
#
# The cloud deployment does NOT use this file — ant-cloud mounts its own
# nginx.conf from a K8s ConfigMap onto the same image.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    client_max_body_size 100m;
    # Keep Location headers relative — the container port (8080) differs from
    # the published host port, so an absolute redirect would point off-origin.
    absolute_redirect off;

    location = / {
        return 302 /app/;
    }
    location = /app {
        return 301 /app/;
    }

    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /app/index.html;
    }

    location /api/ {
        proxy_pass http://ant-api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ide {
        proxy_pass http://ant-api:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location /realtime {
        proxy_pass http://ant-realtime:4101;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location /bridge {
        proxy_pass http://ant-realtime:4101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Preview/deploy MANAGEMENT API (control plane). Content is NOT served here —
    # see the :8081 server block below.
    location /projects/ {
        proxy_pass http://ant-preview:4102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }
}

# Preview/deploy CONTENT origin (published as :4201).
#
# Deliberately a different origin from :8080 above and carries NO control-plane
# route: everything served here is user-authored, so a document served here has no
# same-origin API to drive with the viewer's session (report H-NEW-001). The
# backend enforces the same split — ant-preview's content listener mounts only the
# proxies, and its control plane refuses cross-origin cookie-authenticated writes.
server {
    listen 8081;
    client_max_body_size 100m;
    absolute_redirect off;

    # Path-routed previews and deploys (/{urlKey}/…, /deploy/{urlKey}/…) plus
    # their HMR websockets. ant-preview's own 404 handler covers strays.
    location / {
        proxy_pass http://ant-preview:4103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
